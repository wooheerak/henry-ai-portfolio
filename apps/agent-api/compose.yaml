services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: agent
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - agent_pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://agent:agent_local@db:5432/agent
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  agent_pgdata:
